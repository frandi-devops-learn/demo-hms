name: Build and push Docker images

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-configuration:
    name: Validate registry configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check required Docker Hub settings
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "Repository variable DOCKERHUB_NAMESPACE is required."
            exit 1
          fi
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Repository secret DOCKERHUB_USERNAME is required."
            exit 1
          fi
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Repository secret DOCKERHUB_TOKEN is required."
            exit 1
          fi

  build-and-push:
    name: Build ${{ matrix.service }}
    needs: validate-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: api-gateway
            dockerfile: services/api-gateway/Dockerfile
          - service: auth-service
            dockerfile: services/auth-service/Dockerfile
          - service: bookings-service
            dockerfile: services/bookings-service/Dockerfile
          - service: frontend
            dockerfile: services/frontend/Dockerfile
          - service: notifications-service
            dockerfile: services/notifications-service/Dockerfile
          - service: operations-service
            dockerfile: services/operations-service/Dockerfile
          - service: payment-service
            dockerfile: services/payment-service/Dockerfile
          - service: rooms-service
            dockerfile: services/rooms-service/Dockerfile
          - service: users-service
            dockerfile: services/users-service/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/hotel-management-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
